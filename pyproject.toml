[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
indexing = [
    "pymupdf>=1.28.2",
    "pymupdf4llm>=0.1.9",
    "pypdf>=6.16.1",
    "opencv-python-headless>=5.0.0",
]

dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.1.1",
    "ragas>=0.3.1",
    "langchain-openai>=1.6.0",
]

vector-stores = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "langchain-chroma>=1.1.0",
]

llm-alt = [
    "ollama>=0.6.2",
    "langchain-ollama>=1.1.0",
]

[tool.uv]
link-mode = "copy"

[tool.vercel]
entrypoint = "rag_deploy.main:app"